name: Build unsigned iOS IPA (workout-offline)

on:
  workflow_dispatch: {}

jobs:
  build-ipa:
    runs-on: macos-26
    env:
      APP_DIR: artifacts/workout-offline
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (generate native ios project)
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install --repo-update

      - name: Debug - inspect generated iOS project
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          echo "--- Top-level contents of ios/ ---"
          ls -la
          echo "--- All .xcworkspace found (recursive) ---"
          find . -iname "*.xcworkspace" -maxdepth 3
          echo "--- Checking each for contents.xcworkspacedata ---"
          for w in $(find . -iname "*.xcworkspace" -maxdepth 3); do
            echo "Workspace: $w"
            ls -la "$w" || true
          done
          echo "--- Podfile.lock present? ---"
          ls -la Podfile.lock 2>&1 || echo "MISSING Podfile.lock"

      - name: Show available schemes (debug helper)
        working-directory: ${{ env.APP_DIR }}/ios
        run: xcodebuild -list -workspace *.xcworkspace

      - name: Build app (unsigned)
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          WORKSPACE=""
          for w in *.xcworkspace; do
            if [ -f "$w/contents.xcworkspacedata" ]; then
              WORKSPACE="$w"
              break
            fi
          done
          if [ -z "$WORKSPACE" ]; then
            echo "No valid .xcworkspace with contents.xcworkspacedata found. Did pod install run?"
            exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^ *//' | head -n1)
          if [ -z "$SCHEME" ]; then
            echo "Could not detect a scheme from: "
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Debug - inspect build products
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          echo "--- Contents of Release-iphoneos products dir ---"
          ls -la build/DerivedData/Build/Products/Release-iphoneos/ || echo "MISSING products dir"
          echo "--- Any .app anywhere under DerivedData ---"
          find build/DerivedData -iname "*.app" -maxdepth 6

      - name: Package .ipa (unsigned)
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r WorkoutOffline-unsigned.ipa Payload
          ls -la WorkoutOffline-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutOffline-unsigned-ipa
          path: ${{ env.APP_DIR }}/ios/build/WorkoutOffline-unsigned.ipa
