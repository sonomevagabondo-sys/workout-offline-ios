kind = "mobile"
previewPath = "/"
title = "Workout Offline"
description = "Un’app mobile iOS-first per registrare allenamenti in palestra senza account né cloud, con cicli di 7 giorni, streak, programmi personalizzati e statistiche locali."
version = "1.0.0"
id = "artifacts/workout-offline"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23661

[services.development]
run = "pnpm --filter @workspace/workout-offline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workout-offline", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/workout-offline", "run", "serve" ]

[services.env]
PORT = "23661"
BASE_PATH = "/"
